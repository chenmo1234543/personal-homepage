<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Chen Mo 的个人主页">
  <title>Chen Mo · 个人主页</title>
  <style>
    :root {
      --blue: #2563eb;
      --blue-deep: #1e3a8a;
      --blue-soft: #dbeafe;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --bg: #ffe6d8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(160deg, #fff7f2 0%, var(--bg) 55%, #ffd9c9 100%);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.7;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 560px;
      padding: 56px 48px 40px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 18px 50px -24px rgba(37, 99, 235, .35);
      overflow: hidden;
      animation: rise .7s cubic-bezier(.2, .7, .3, 1) both;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 5px;
      background: linear-gradient(90deg, var(--blue-deep), var(--blue), #7dd3fc);
    }

    .eyebrow {
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 18px 0 28px;
      font-size: clamp(24px, 5vw, 32px);
      font-weight: 600;
      letter-spacing: -.01em;
      color: var(--blue-deep);
    }

    .name {
      display: inline-block;
      font-size: clamp(36px, 8vw, 52px);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -.03em;
      color: var(--blue);
      background: linear-gradient(120deg, var(--blue) 20%, #60a5fa 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .handle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: .04em;
    }

    .rule {
      width: 44px;
      height: 3px;
      margin: 32px 0 24px;
      border-radius: 2px;
      background: var(--blue-soft);
    }

    .intro {
      max-width: 42ch;
      font-size: 16px;
      color: #334155;
    }

    .intro strong { color: var(--blue-deep); font-weight: 600; }

    .hobbies { margin-top: 36px; }

    .hobbies h2 {
      margin-bottom: 16px;
      color: var(--blue-deep);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .hobbies ul {
      list-style: none;
      display: grid;
      gap: 10px;
    }

    .hobbies li {
      padding: 12px 16px 12px 18px;
      border: 1px solid #ffe3d3;
      border-left: 3px solid var(--blue);
      border-radius: 10px;
      background: #fff8f4;
    }

    .hobbies strong {
      display: block;
      color: var(--blue-deep);
      font-size: 15px;
      font-weight: 600;
    }

    .hobbies span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 13px;
    }

    footer {
      margin-top: 44px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .03em;
    }

    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 8px;
      border-radius: 50%;
      background: var(--blue);
      vertical-align: 1px;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
    }

    @media (max-width: 480px) {
      .card { padding: 44px 28px 32px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Personal Homepage</p>

    <h1>你好，欢迎来到我的主页</h1>

    <p class="name">Chen Mo</p>
    <p class="handle">@chenmo1234545</p>

    <div class="rule" aria-hidden="true"></div>

    <p class="intro">
      喜欢把复杂的事情做简单，也喜欢在代码与文字之间，找一点<strong>安静的秩序</strong>。
      这里是我在网络上的一小块自留地，随手记下想法与作品。
    </p>

    <section class="hobbies">
      <h2>我的爱好</h2>
      <ul>
        <li>
          <strong>城市漫步</strong>
          <span>不带目的地走走，收集街角的光和旧招牌。</span>
        </li>
        <li>
          <strong>胶片摄影</strong>
          <span>慢慢等一卷拍完，也慢慢等它洗出来。</span>
        </li>
        <li>
          <strong>深夜阅读</strong>
          <span>灯下翻几页闲书，把白天调成静音。</span>
        </li>
      </ul>
    </section>

    <footer><span class="dot" aria-hidden="true"></span>© 2026 Chen Mo · 保持简单，保持好奇</footer>
  </main>
</body>
</html>
